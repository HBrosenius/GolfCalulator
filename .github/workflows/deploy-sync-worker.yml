name: Deploy sync-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync-worker/**'
      - '.github/workflows/deploy-sync-worker.yml'

permissions: {}

jobs:
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Apply staging database migrations
        run: npx wrangler d1 migrations apply golfcalc-accounts-staging --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy staging
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check staging protocol
        run: curl --fail --retry 5 --retry-delay 3 --retry-all-errors https://golfcalc-sync-staging.golfcalc-sync.workers.dev/health
      - name: Apply production database migrations
        run: npx wrangler d1 migrations apply golfcalc-accounts --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
