name: Deploy sync-worker

on:
  push:
    branches: [main]
    paths:
      - 'sync-worker/**'
      - '.github/workflows/deploy-sync-worker.yml'

jobs:
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Deploy staging
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check staging protocol
        run: curl --fail --retry 5 --retry-delay 3 https://golfcalc-sync-staging.golfcalc-sync.workers.dev/health
      - name: Deploy production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  verify:
    uses: ./.github/workflows/verify.yml
